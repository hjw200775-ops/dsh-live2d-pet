name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 手动发布过再推 tag 时，不要让 CI 变红
      - name: Check whether this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-deepseek-live2d@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-deepseek-live2d@$VERSION 已存在，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 防止 tag 与 package.json 版本对不上，发出去一个名不副实的包
      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $VERSION 不一致"
            exit 1
          fi

      # 依赖 OIDC（id-token: write），不需要任何 NODE_AUTH_TOKEN 密钥
      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish
