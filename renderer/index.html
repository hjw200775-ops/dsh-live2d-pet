<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>DeepSeek-chan</title></head>
<body>
<main id="pet">
  <canvas id="canvas" aria-label="DeepSeek-chan Live2D 模型"></canvas>
  <p id="bubble" hidden></p>
  <p id="balance" hidden>余额…</p>
  <p id="status" role="status">检查本地模型与运行时…</p>
</main>
<aside id="panel" hidden>
  <header><strong>设置</strong><button data-act="close" type="button">关闭</button></header>
  <p id="activity" role="status">待机</p>
  <p id="save-state" role="status" hidden></p>
  <button data-act="larger" type="button">放大</button>
  <button data-act="smaller" type="button">缩小</button>
  <button data-act="reset" type="button">复位大小</button>
  <button id="pause" type="button">暂停</button>
  <div id="follow-controls">
    <button id="mouse-follow" type="button" aria-pressed="true">鼠标跟随：开</button>
    <label for="follow-range">识别半径 <output id="follow-radius-label">1200</output><span id="follow-radius-unit"> 像素</span></label>
    <input id="follow-range" type="range" min="100" max="4000" step="1" value="1200" aria-label="鼠标识别半径">
    <input id="follow-radius-number" type="number" min="100" max="4000" step="1" value="1200" aria-label="精确设置识别半径">
    <label><input id="follow-unlimited" type="checkbox"> 全屏跟随</label>
  </div>
  <button data-act="refresh" type="button">刷新余额</button>
  <button data-act="pin" type="button">取消置顶</button>
  <button data-act="quit" type="button">退出</button>
  <button id="quit-host" data-act="host" type="button">随 DSH 退出：关</button>
  <p class="section">互动反馈</p>
  <div id="interaction">
    <label><input id="interaction-head" type="checkbox" checked> 摸头反馈</label>
    <label><input id="interaction-body" type="checkbox" checked> 身体单击反馈</label>
    <label><input id="interaction-double" type="checkbox" checked> 双击反馈</label>
    <label for="interaction-cooldown">冷却（毫秒，0–10000）</label>
    <input id="interaction-cooldown" type="number" min="0" max="10000" step="50" value="650" aria-label="互动冷却毫秒">
    <label for="interaction-bubble-head">摸头气泡（逗号分隔，留空不弹）</label>
    <input id="interaction-bubble-head" type="text" maxlength="600" placeholder="嗯？，在的，嘿嘿" aria-label="摸头气泡文案">
    <label for="interaction-bubble-body">身体单击气泡</label>
    <input id="interaction-bubble-body" type="text" maxlength="600" placeholder="留空则不弹" aria-label="身体单击气泡文案">
    <label for="interaction-bubble-double">双击气泡</label>
    <input id="interaction-bubble-double" type="text" maxlength="600" placeholder="嘿嘿！" aria-label="双击气泡文案">
    <button id="interaction-reset" type="button">恢复默认互动设置</button>
  </div>
  <p class="section">装扮</p>
  <div id="outfit"></div>
  <button data-act="restore" type="button">恢复原始装扮</button>
  <p class="section">表情</p>
  <div id="faces"></div>
  <p class="section">动作</p>
  <div id="motions"></div>
  <button data-act="auto" type="button">恢复自动</button>
  <p id="pace">绘制间隔统计中…</p>
  <p class="credit">DeepSeek-chan · Kamiya Ryoko / 神宫凉子<br>Live2D Rigging：霓虹猫_NeonNeko<br>程序代码 MIT。模型与 Cubism Core 不在此许可内。</p>
</aside>
<script type="module">
import('./viewer.js').catch(error=>{
  const status=document.getElementById('status');
  if(!status)return;
  status.hidden=false;
  status.classList.add('error');
  status.textContent=`桌宠没能启动\n\n${error.message||error}`;
});
</script>
</body></html>
